name: clean_app
description: "زفـة - تطبيق خدمات الأفراح والمناسبات"
publish_to: 'none'
version: 1.0.4+11

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cupertino_icons: ^1.0.8
  bcrypt: ^1.1.3
  flutter_secure_storage: ^9.0.0
  table_calendar: ^3.0.9
  firebase_auth: ^5.4.4
  intl: 0.20.2
  google_fonts: ^6.2.1

  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.1
  shared_preferences: ^2.5.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  google_maps_flutter: ^2.6.0
  google_maps_flutter_android: '>=2.12.3 <2.14.0'
  geolocator: ^10.1.0
  fl_chart: ^1.0.0
  url_launcher: ^6.1.0
  app_links: ^6.3.2
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon_new.png
    - assets/home1.png          # شعار التطبيق
    - assets/hall.png           # قاعات اعراس
    - assets/hotel.png          # فنادق
    - assets/cake.png           # كيك
    - assets/restaurant.png     # طعام
    - assets/bride_dress.png    # فستان الزفاف
    - assets/salon_care.png     # صالون وعناية
    - assets/flowers.png        # ورد
    - assets/groom_suit.png     # بدلة رجالي
    - assets/car.png            # تاجير السيارات
    - assets/car_decoration.png # تزيين السيارة
    - assets/honeymoon.png      # سياحة
    - assets/photography.png   # تصوير
    - assets/fonts/
    - assets/fonts/android/
    - assets/fonts/ios/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon_new.png"
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/app_icon_new.png"
  adaptive_icon_background: "#FFFFFF"  # خلفية بيضاء لتتناسب مع الصورة

flutter_native_splash:
  image: assets/app_icon_splash.png
  color: "#ffffff"
  android: true
  ios: true
  android_12:
    image: assets/app_icon_splash.png
    color: "#ffffff"
  android_gravity: center
  fullscreen: true

